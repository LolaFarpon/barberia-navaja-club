<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #6b4226 0%, #8b5e3c 50%, #c9a679 100%);
            min-height: 100vh;
        }
        .card-login {
            background-color: #fffaf0;
            border: 1px solid #d9c4a3;
            border-radius: 12px;
        }
        .titulo-login {
            font-family: 'Playfair Display', serif;
            color: #6b4226;
        }
        .form-label {
            color: #6b4226;
        }
        .input-login {
            background-color: #fffaf0;
            border: 1px solid #c9a679;
            color: #4a3527;
        }
        .input-login:focus {
            background-color: #fffaf0;
            border-color: #8b5e3c;
            color: #4a3527;
            box-shadow: 0 0 0 0.2rem rgba(139, 94, 60, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #6b4226, #8b5e3c);
            color: #fdf6ec;
            border: none;
            font-weight: 600;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #5a3620, #74502f);
            color: #fdf6ec;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
        <div class="card-login p-4" style="width: 350px;">
            <h4 class="text-center mb-3 titulo-login">Acceso Administrador</h4>

            <div id="mensajeError" class="alert alert-danger d-none" role="alert"></div>

            <form id="formLogin">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control input-login" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control input-login" id="password" required>
                </div>
                <button type="submit" class="btn btn-login w-100">Ingresar</button>
            </form>
        </div>
    </div>

    <script src="js/admin-login.js"></script>
</body>
</html>
